patrol_node:
  ros__parameters:
    waypoints_file: ~/waypoints.yaml
    scan_duration: 5.0
    rotation_speed: 0.25
    rotation_min_omega: 0.18
    angular_accel_limit: 2.0
    rotation_kp: 1.0
    rotation_timeout: 25.0
    odom_angular_scale_correction: 1.0
    yaw_tolerance: 0.05
    aruco_align_tolerance: 0.045
    aruco_align_max_iters: 4
    aruco_rotation_speed: 0.18
    aruco_rotation_kp: 1.2
    aruco_pulse_kick_speed: 0.24
    aruco_pulse_kick_duration: 0.7
    aruco_pulse_startup_time: 1.3
    aruco_pulse_min_duration: 1.4
    aruco_pulse_max_duration: 2.8
    camera_nav_tilt: -30
    camera_align_tilt: 0
    camera_settle_time: 0.5
    xy_goal_tolerance: 0.10
    post_arrival_actions_enabled: false
    waypoint_error_log_file: ~/waypoint_error_log.csv
    amcl_settle_time: 1.0
    amcl_fresh_timeout: 4.0
    amcl_max_age: 0.5
    amcl_nomotion_service: /request_nomotion_update
    amcl_stable_samples: 3
    amcl_stable_tolerance: 0.02
    amcl_stable_timeout: 8.0
    amcl_sample_interval: 0.3
