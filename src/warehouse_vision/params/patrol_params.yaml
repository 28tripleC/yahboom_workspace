patrol_node:
  ros__parameters:
    waypoints_file: ~/waypoints.yaml
    scan_duration: 5.0
    rotation_speed: 0.25
    rotation_min_omega: 0.18
    angular_accel_limit: 2.0
    rotation_kp: 1.0
    rotation_timeout: 25.0
    odom_angular_scale_correction: 1.0
    yaw_tolerance: 0.05
    aruco_align_tolerance: 0.045
    aruco_align_max_iters: 4
    aruco_rotation_speed: 0.16
    aruco_rotation_kp: 1.2
    camera_nav_tilt: -30
    camera_align_tilt: 0
    camera_settle_time: 0.5
